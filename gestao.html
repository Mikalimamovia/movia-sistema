function PhotoUploader({ sb, value, onChange, commitOnBlur = false }) {
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState('');
  // No campo de "adicionar foto", o link só é aceito ao apertar Enter ou sair do campo
  // (antes, cada letra digitada virava uma foto nova).
  const [draft, setDraft] = useState('');
  const commitDraft = () => {
    const v = draft.trim();
    if (v) { onChange(v); setDraft(''); }
  };

  const handleFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setError('');
    setUploading(true);
    try {
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${uid('photo')}.${ext}`;
      const { error: upErr } = await sb.storage.from('product-photos').upload(path, file, { upsert: true, contentType: file.type });
      if (upErr) throw upErr;
      const { data } = sb.storage.from('product-photos').getPublicUrl(path);
      onChange(data.publicUrl);
    } catch (err) {
      setError('Erro ao enviar: ' + (err.message || 'tente novamente'));
    } finally {
      setUploading(false);
    }
  };

  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-center gap-2">
        {value ? (
          <img src={value} alt="" className="w-10 h-10 object-cover rounded border border-neutral-700" />
        ) : (
          <div className="w-10 h-10 rounded border border-neutral-800 flex items-center justify-center text-neutral-700"><ImageIcon size={16} /></div>
        )}
        <input type="file" accept="image/*" onChange={handleFile} className="text-[11px] text-neutral-400 max-w-[160px]" />
        {uploading && <span className="text-[11px] text-neutral-500">enviando...</span>}
      </div>
      {commitOnBlur ? (
        <input
          className="fw-input" placeholder="ou cole o link de uma foto (https://...)"
          value={draft} onChange={e => setDraft(e.target.value)} onBlur={commitDraft}
          onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commitDraft(); } }}
        />
      ) : (
        <input className="fw-input" placeholder="ou cole o link de uma foto (https://...)" value={value || ''} onChange={e => onChange(e.target.value)} />
      )}
      {error && <span className="text-[11px] text-white">{error}</span>}
    </div>
  );
}

function MultiPhotoUploader({ sb, photos, onChange }) {
  const arr = photos || [];
  const setAt = (i, url) => {
    const next = [...arr];
    if (url) next[i] = url; else next.splice(i, 1);
    onChange(next.filter(Boolean));
  };
  return (
    <div className="flex flex-col gap-2">
      {arr.map((url, i) => (
        <div key={i} className="flex items-center gap-2">
          <div className="flex-1"><PhotoUploader sb={sb} value={url} onChange={u => setAt(i, u)} /></div>
          <button type="button" onClick={() => setAt(i, '')} className="fw-btn-ghost"><X size={12} /></button>
        </div>
      ))}
      {arr.length < MAX_PHOTOS && (
        <PhotoUploader
          sb={sb} value="" commitOnBlur
          onChange={u => onChange(prev => { const cur = prev || []; return (u && cur.length < MAX_PHOTOS) ? [...cur, u] : cur; })}
        />
      )}
      <div className="text-[11px] text-neutral-600">{arr.length}/{MAX_PHOTOS} fotos</div>
    </div>
  );
}

const EMPTY_PRODUCT_FORM = { name: '', category: '', cost: '', retail: '', wholesale: '', minStock: 3, colors: '', sizes: ['P', 'M', 'G', 'GG'], photos: [], description: '', notes: '' };

function ProductsTab({ sb, products, onAdd, onUpdate, onDelete }) {
  const [form, setForm] = useState(EMPTY_PRODUCT_FORM);
  const [editingId, setEditingId] = useState(null);
  const [formError, setFormError] = useState('');

  const startEdit = (p) => {
    setEditingId(p.id);
    setFormError('');
    setForm({
      name: p.name, category: p.category, cost: p.cost, retail: p.retail, wholesale: p.wholesale,
      minStock: p.minStock, colors: [...new Set(p.variants.map(v => v.color))].join(', '),
      sizes: ALL_SIZES.filter(s => p.variants.some(v => v.size === s)),
      photos: p.photos || [], description: p.description || '', notes: p.notes || '',
    });
  };
  const cancelEdit = () => { setEditingId(null); setFormError(''); setForm(EMPTY_PRODUCT_FORM); };

  // "Único" é exclusivo: marcar ele desmarca os demais, e marcar qualquer outro desmarca o "Único"
  const toggleSize = (size) => {
    setFormError('');
    setForm(f => {
      const has = f.sizes.includes(size);
      let sizes;
      if (size === 'Único') {
        sizes = has ? [] : ['Único'];
      } else {
        const base = f.sizes.filter(s => s !== 'Único');
        sizes = has ? base.filter(s => s !== size) : ALL_SIZES.filter(s => base.includes(s) || s === size);
      }
      return { ...f, sizes };
    });
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.name.trim()) return;
    const colors = form.colors.split(',').map(c => c.trim()).filter(Boolean);
    if (colors.length === 0) colors.push('Único');
    if (form.sizes.length === 0) {
      setFormError('Marque pelo menos um tamanho (ou "Tamanho único") antes de salvar.');
      return;
    }
    setFormError('');
    const sizes = form.sizes;

    const patch = {
      name: form.name, category: form.category || 'Geral',
      cost: Number(form.cost) || 0, retail: Number(form.retail) || 0, wholesale: Number(form.wholesale) || 0,
      minStock: Number(form.minStock) || 3, photos: form.photos || [],
      description: form.description || '', notes: form.notes || '',
    };

    if (editingId) {
      // Preserva o estoque já lançado para cores/tamanhos que continuam existindo;
      // só zera estoque para cores/tamanhos novos adicionados na edição.
      const current = products.find(p => p.id === editingId);
      const existingVariants = (current && current.variants) || [];
      const dropped = existingVariants.filter(v => v.stock > 0 && !(colors.includes(v.color) && sizes.includes(v.size)));
      if (dropped.length > 0) {
        const totalDropped = dropped.reduce((s, v) => s + v.stock, 0);
        const list = dropped.slice(0, 6).map(v => `${v.color}/${v.size} (${v.stock})`).join(', ') + (dropped.length > 6 ? '…' : '');
        const ok = window.confirm(`Atenção: ao salvar, ${dropped.length} variação(ões) com estoque serão removidas e esse estoque será perdido (${totalDropped} peça(s) no total): ${list}.\n\nDeseja continuar?`);
        if (!ok) return;
      }
      const variants = colors.flatMap(color => sizes.map(size => {
        const found = existingVariants.find(v => v.color === color && v.size === size);
        return found || { color, size, stock: 0 };
      }));
      onUpdate(editingId, { ...patch, variants });
      cancelEdit();
    } else {
      const variants = colors.flatMap(color => sizes.map(size => ({ color, size, stock: 0 })));
      onAdd({ id: uid('prod'), ...patch, variants });
      setForm(EMPTY_PRODUCT_FORM);
    }
  };

  return (
    <div>
      <Section title={editingId ? `Editando: ${form.name || 'produto'}` : 'Cadastro de produtos'}>
        {editingId && (
          <div className="text-[12px] text-neutral-300 bg-neutral-900 border border-neutral-700 p-2 mb-3">
            Editando um produto existente. O estoque já lançado para as cores/tamanhos que continuarem aqui é preservado — só cores/tamanhos novos começam com estoque zerado.
          </div>
        )}
        <form onSubmit={submit} className="bg-neutral-950 border border-neutral-800 p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-4">
          <Field label="Nome do produto"><input className="fw-input" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="Legging Fusô" /></Field>
          <Field label="Categoria"><input className="fw-input" value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))} placeholder="Legging, Top, Camiseta..." /></Field>
          <Field label="Cores (separadas por vírgula)"><input className="fw-input" value={form.colors} onChange={e => setForm(f => ({ ...f, colors: e.target.value }))} placeholder="Preto, Bege, Verde" /></Field>
          <Field label="Preço de custo"><input type="number" step="0.01" className="fw-input" value={form.cost} onChange={e => setForm(f => ({ ...f, cost: e.target.value }))} /></Field>
          <Field label="Preço varejo"><input type="number" step="0.01" className="fw-input" value={form.retail} onChange={e => setForm(f => ({ ...f, retail: e.target.value }))} /></Field>
          <Field label="Preço atacado"><input type="number" step="0.01" className="fw-input" value={form.wholesale} onChange={e => setForm(f => ({ ...f, wholesale: e.target.value }))} /></Field>
          <Field label="Estoque mínimo por variação"><input type="number" className="fw-input" value={form.minStock} onChange={e => setForm(f => ({ ...f, minStock: e.target.value }))} /></Field>
          <Field label="Composição/tecido (opcional)"><input className="fw-input" value={form.description} onChange={e => setForm(f => ({ ...f, description: e.target.value }))} placeholder="Ex: 80% poliamida, 20% elastano" /></Field>
          <Field label="Observações (opcional)"><input className="fw-input" value={form.notes} onChange={e => setForm(f => ({ ...f, notes: e.target.value }))} placeholder="Ex: modelagem justa, veste menor" /></Field>
          <div className="sm:col-span-2 md:col-span-3">
            <Field label="Tamanhos disponíveis para este produto">
              <div className="flex gap-3 flex-wrap">
                {ALL_SIZES.map(s => (
                  <label key={s} className="flex items-center gap-1.5 text-sm text-neutral-300">
                    <input type="checkbox" checked={form.sizes.includes(s)} onChange={() => toggleSize(s)} />
                    {s === 'Único' ? 'Tamanho único' : s}
                  </label>
                ))}
              </div>
              <span className="text-[11px] text-neutral-500">Tamanho único serve para peças que vestem do P ao G. Ao marcar, os demais tamanhos são desmarcados.</span>
              {formError && <div className="text-[12px] text-white bg-neutral-900 border border-white p-2 mt-1">{formError}</div>}
            </Field>
          </div>
          <div className="sm:col-span-2 md:col-span-3"><Field label="Fotos do produto (até 7, opcional)"><MultiPhotoUploader sb={sb} photos={form.photos} onChange={upd => setForm(f => ({ ...f, photos: typeof upd === 'function' ? upd(f.photos || []) : upd }))} /></Field></div>
          <div className="sm:col-span-2 md:col-span-3 flex justify-end gap-3">
            {editingId && <button type="button" onClick={cancelEdit} className="fw-btn-ghost">Cancelar edição</button>}
            <button className="fw-btn" type="submit">
              {editingId ? <Check size={14} /> : <Plus size={14} />}
              {editingId ? 'Salvar alterações' : 'Adicionar produto'}
            </button>
          </div>
        </form>
      </Section>

      <div className="bg-neutral-950 border border-neutral-800 overflow-x-auto">
        <table className="w-full fw-table">
          <thead><tr><th>Foto</th><th>Produto</th><th>Categoria</th><th>Custo</th><th>Varejo</th><th>Atacado</th><th>Variações</th><th></th></tr></thead>
          <tbody>
            {products.length === 0 && <tr><td colSpan={8} className="text-neutral-600 text-center py-6">Nenhum produto cadastrado.</td></tr>}
            {products.map(p => (
              <tr key={p.id} className={editingId === p.id ? 'bg-neutral-900' : ''}>
                <td>
                  {p.photos && p.photos[0] ? (
                    <div className="relative w-9 h-9">
                      <img src={p.photos[0]} alt="" className="w-9 h-9 object-cover rounded border border-neutral-700" />
                      {p.photos.length > 1 && <span className="absolute -bottom-1 -right-1 bg-white text-black text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center">{p.photos.length}</span>}
                    </div>
                  ) : (
                    <div className="w-9 h-9 rounded border border-neutral-800 flex items-center justify-center text-neutral-700"><ImageIcon size={14} /></div>
                  )}
                </td>
                <td className="font-medium text-neutral-100">{p.name}</td>
                <td>{p.category}</td>
                <td>{formatBRL(p.cost)}</td>
                <td>{formatBRL(p.retail)}</td>
                <td>{formatBRL(p.wholesale)}</td>
                <td>{p.variants.length} ({[...new Set(p.variants.map(v => v.color))].join(', ')})</td>
                <td className="flex gap-1">
                  <button onClick={() => startEdit(p)} className="fw-btn-ghost"><Pencil size={13} /></button>
                  <button onClick={() => onDelete(p.id)} className="fw-btn-ghost"><Trash2 size={13} /></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ---------- Catalog (vitrine pública) ----------
// ---------- Abas do catálogo (ex.: Black Friday) ----------
const TAB_COLORS = [
  { hex: '#000000', label: 'Preto' }, { hex: '#1c1c1e', label: 'Grafite' }, { hex: '#5a0f1e', label: 'Vinho' },
  { hex: '#0b1e3b', label: 'Marinho' }, { hex: '#0f3d2e', label: 'Verde' }, { hex: '#f7f5f0', label: 'Marfim' },
  { hex: '#ffffff', label: 'Branco' }, { hex: '#f6d9de', label: 'Rosa' },
];
function emptyTabForm() {
  return { name: '', kind: 'promo', bg: '#000000', slogan: '', subtitle: '', start: '', end: '', active: true, productIds: [], prices: {} };
}
function tabStatusLabel(t, now) {
  const st = tabState(t, now);
  if (st === 'off') return { text: 'Desligada', tone: 'text-neutral-500' };
  if (st === 'soon') return { text: 'Agendada · começa ' + fmtTabDate(t.start), tone: 'text-yellow-400' };
  if (st === 'ended') return { text: 'Encerrada em ' + fmtTabDate(t.end), tone: 'text-red-400' };
  return { text: t.kind === 'promo' ? 'No ar agora' + (t.end ? ' · até ' + fmtTabDate(t.end) : '') : 'No ar (fixa)', tone: 'text-green-400' };
}
function TabPreview({ f }) {
  const th = themeFor(f.bg); const v = th.vars;
  return (
    <div className="p-4 border border-neutral-700" style={{ background: v['--bg'], color: v['--fg'] }}>
      <div style={{ fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', color: v['--muted'] }}>{f.name || 'nome da aba'}</div>
      <div style={{ fontWeight: 800, fontSize: 18, lineHeight: 1.2, marginTop: 4 }}>Peças pensadas para o seu <span style={{ color: v['--muted'] }}>movimento.</span></div>
      <div style={{ marginTop: 8, padding: '8px 10px', background: v['--band'], border: '1px solid ' + v['--line'], fontWeight: 800, fontSize: 12, textAlign: 'center' }}>{f.slogan || 'Seu movimento, sua evolução!'}</div>
      {f.kind === 'promo' && (
        <div style={{ marginTop: 10, display: 'flex', alignItems: 'baseline', gap: 8 }}>
          <span style={{ textDecoration: 'line-through', color: v['--faint'], fontSize: 12 }}>R$ 199,90</span>
          <span style={{ color: v['--accent'], fontWeight: 700, fontSize: 16 }}>R$ 139,90</span>
          <span style={{ background: v['--accent'], color: '#fff', fontSize: 11, fontWeight: 700, padding: '2px 6px' }}>-30%</span>
        </div>
      )}
      <div style={{ marginTop: 10, display: 'inline-block', padding: '8px 14px', background: v['--fg'], color: v['--bg'], fontSize: 11, fontWeight: 700, letterSpacing: '0.08em' }}>ADICIONAR À SACOLA</div>
    </div>
  );
}
function TabForm({ products, initial, onSave, onCancel }) {
  const [f, setF] = useState(initial || emptyTabForm());
  const [q, setQ] = useState('');
  const [pct, setPct] = useState('');
  const [err, setErr] = useState('');
  const [hexText, setHexText] = useState((initial && initial.bg) || '#000000');
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));
  const promo = f.kind === 'promo';
  useEffect(() => { if (/^#[0-9a-fA-F]{6}$/.test(f.bg) && f.bg.toLowerCase() !== hexText.toLowerCase() && !(hexText.length === 4 && '#' + hexText.slice(1).split('').map(c => c + c).join('').toLowerCase() === f.bg)) setHexText(f.bg.toUpperCase()); }, [f.bg]);
  const sel = new Set(f.productIds);
  const shown = products.filter(p => !q.trim() || (p.name || '').toLowerCase().includes(q.trim().toLowerCase()));
  const toggle = (id) => setF(x => {
    const s = new Set(x.productIds);
    if (s.has(id)) { s.delete(id); const pr = { ...x.prices }; delete pr[id]; return { ...x, productIds: [...s], prices: pr }; }
    s.add(id); return { ...x, productIds: [...s] };
  });
  const selectShown = () => setF(x => ({ ...x, productIds: [...new Set([...x.productIds, ...shown.map(p => p.id)])] }));
  const clearAll = () => setF(x => ({ ...x, productIds: [], prices: {} }));
  const applyPct = () => {
    const n = Number(pct);
    if (!(n > 0 && n < 100)) { setErr('Informe um desconto entre 1 e 99%.'); return; }
    setErr('');
    setF(x => {
      const pr = { ...x.prices };
      x.productIds.forEach(id => { const p = products.find(pp => pp.id === id); if (p && p.retail > 0) pr[id] = Math.round(p.retail * (1 - n / 100) * 100) / 100; });
      return { ...x, prices: pr };
    });
  };
  const submit = (e) => {
    e.preventDefault();
    if (!f.name.trim()) { setErr('Dê um nome à aba.'); return; }
    if (f.productIds.length === 0) { setErr('Escolha pelo menos um produto.'); return; }
    if (promo) {
      if (!f.end) { setErr('Informe até quando a promoção vale (fim do período).'); return; }
      if (f.start && f.end <= f.start) { setErr('O fim do período precisa ser depois do início.'); return; }
      const bad = f.productIds.find(id => { const p = products.find(pp => pp.id === id); const v = Number(f.prices[id]); return p && f.prices[id] !== undefined && f.prices[id] !== '' && !(v > 0 && v < p.retail); });
      if (bad) { setErr('Há preço promocional igual ou maior que o preço normal. Corrija ou deixe em branco.'); return; }
    }
    const prices = {};
    if (promo) f.productIds.forEach(id => { const v = Number(f.prices[id]); if (v > 0) prices[id] = v; });
    onSave({ ...f, name: f.name.trim(), slogan: f.slogan.trim(), subtitle: f.subtitle.trim(), prices });
  };
  return (
    <form onSubmit={submit} className="bg-neutral-950 border border-neutral-800 p-4 mb-4">
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <Field label="Nome da aba"><input className="fw-input" value={f.name} onChange={e => set('name', e.target.value)} placeholder="Ex.: Black Friday" /></Field>
        <Field label="Tipo da aba">
          <select className="fw-input" value={f.kind} onChange={e => set('kind', e.target.value)}>
            <option value="promo">Promocional (período + preço)</option>
            <option value="fixed">Fixa (sempre visível)</option>
          </select>
        </Field>
        {promo && <Field label="Início (opcional — vazio = já)"><input type="datetime-local" className="fw-input" value={f.start} onChange={e => set('start', e.target.value)} /></Field>}
        {promo && <Field label="Fim da promoção"><input type="datetime-local" className="fw-input" value={f.end} onChange={e => set('end', e.target.value)} /></Field>}
        <Field label="Frase do letreiro animado (depois do “movia.”)"><input className="fw-input" value={f.slogan} onChange={e => set('slogan', e.target.value)} placeholder="Ex.: movimentando a sua Black Friday" /></Field>
        <Field label="Texto de apoio (opcional)"><input className="fw-input" value={f.subtitle} onChange={e => set('subtitle', e.target.value)} placeholder="Ex.: Descontos até domingo à meia-noite" /></Field>
      </div>

      <div className="mt-4">
        <div className="text-[11px] text-neutral-500 mb-2">Cor de fundo da aba (as letras se ajustam sozinhas)</div>
        <div className="flex flex-wrap items-center gap-2 mb-3">
          {TAB_COLORS.map(c => (
            <button type="button" key={c.hex} onClick={() => set('bg', c.hex)} title={c.label} aria-label={c.label}
              style={{ width: 34, height: 34, background: c.hex, border: f.bg.toLowerCase() === c.hex ? '2px solid #fff' : '1px solid #555', outline: f.bg.toLowerCase() === c.hex ? '2px solid #000' : 'none' }} />
          ))}
          <input type="color" value={/^#[0-9a-f]{6}$/i.test(f.bg) ? f.bg : '#000000'} onChange={e => set('bg', e.target.value)} aria-label="Escolher outra cor" style={{ width: 44, height: 34, background: 'transparent', border: '1px solid #555', padding: 0 }} />
        </div>
        <div className="flex items-center gap-2 mb-3 max-w-xs">
          <span className="text-[11px] text-neutral-500 shrink-0">Ou digite o código:</span>
          <input className="fw-input fw-mono" style={{ textTransform: 'uppercase' }} maxLength={7} value={hexText} placeholder="#000000" aria-label="Código da cor"
            onChange={e => {
              let v = e.target.value.trim().replace(/[^0-9a-fA-F#]/g, '');
              if (v && v[0] !== '#') v = '#' + v;
              setHexText(v);
              if (/^#[0-9a-fA-F]{6}$/.test(v)) set('bg', v.toLowerCase());
              else if (/^#[0-9a-fA-F]{3}$/.test(v)) set('bg', '#' + v.slice(1).split('').map(c => c + c).join('').toLowerCase());
            }} />
        </div>
        <TabPreview f={f} />
      </div>

      <div className="mt-5">
        <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
          <div className="text-sm text-neutral-100 font-medium">Produtos da aba <span className="text-neutral-500 font-normal">({f.productIds.length} escolhido(s))</span></div>
          <div className="flex gap-2">
            <button type="button" className="fw-btn-ghost" onClick={selectShown}>Marcar {q.trim() ? 'os da busca' : 'todos'}</button>
            <button type="button" className="fw-btn-ghost" onClick={clearAll}>Limpar</button>
          </div>
        </div>
        <input className="fw-input mb-2" placeholder="Buscar produto..." value={q} onChange={e => setQ(e.target.value)} />
        {promo && f.productIds.length > 0 && (
          <div className="flex flex-wrap items-end gap-2 mb-3 p-3 border border-neutral-800">
            <div className="flex-1 min-w-[150px]">
              <div className="text-[11px] text-neutral-500 mb-1">Desconto em lote (% sobre o preço normal)</div>
              <input type="number" inputMode="decimal" min="1" max="99" className="fw-input" value={pct} onChange={e => setPct(e.target.value)} placeholder="Ex.: 30" />
            </div>
            <button type="button" className="fw-btn" onClick={applyPct}>Aplicar aos escolhidos</button>
          </div>
        )}
        <div className="border border-neutral-800 max-h-[420px] overflow-y-auto">
          {shown.length === 0 && <div className="text-neutral-600 text-sm p-4 text-center">Nenhum produto encontrado.</div>}
          {shown.map(p => {
            const on = sel.has(p.id); const v = f.prices[p.id];
            const nv = Number(v); const off = on && promo && nv > 0 && p.retail > 0 ? Math.round((1 - nv / p.retail) * 100) : null;
            const invalid = on && promo && v !== undefined && v !== '' && !(nv > 0 && nv < p.retail);
            return (
              <div key={p.id} className="px-3 py-2 border-b border-neutral-900 last:border-b-0">
                <label className="flex items-center gap-3 cursor-pointer">
                  <input type="checkbox" className="w-5 h-5 accent-white shrink-0" checked={on} onChange={() => toggle(p.id)} />
                  {p.photos && p.photos[0] ? <img src={p.photos[0]} alt="" className="w-10 h-10 object-cover shrink-0" /> : <div className="w-10 h-10 bg-neutral-900 shrink-0" />}
                  <span className="flex-1 min-w-0">
                    <span className="block text-sm text-neutral-100 truncate">{p.name}</span>
                    <span className="block text-[11px] text-neutral-500">{formatBRL(p.retail || 0)}{p.category ? ' · ' + p.category : ''}</span>
                  </span>
                </label>
                {on && promo && (
                  <div className="flex flex-wrap items-center gap-2 mt-2 pl-8">
                    <span className="text-[11px] text-neutral-500 shrink-0">Promo R$</span>
                    <input type="number" inputMode="decimal" step="0.01" min="0" className="fw-input" style={{ maxWidth: 110 }} value={v === undefined ? '' : v} onChange={e => setF(x => ({ ...x, prices: { ...x.prices, [p.id]: e.target.value } }))} placeholder="0,00" />
                    {off !== null && !invalid && <span className="text-[12px] text-green-400 shrink-0">-{off}%</span>}
                    {invalid && <span className="text-[11px] text-red-400">precisa ser menor que {formatBRL(p.retail)}</span>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
        {promo && <div className="text-[11px] text-neutral-500 mt-2">Produto sem preço promocional aparece normalmente na aba, sem desconto.</div>}
      </div>

      <label className="flex items-center gap-3 mt-4 cursor-pointer">
        <input type="checkbox" className="w-5 h-5 accent-white" checked={f.active} onChange={e => set('active', e.target.checked)} />
        <span className="text-sm text-neutral-200">Aba ligada (se desligar, ela some do catálogo mesmo dentro do período)</span>
      </label>
      {err && <div className="text-[12px] text-red-400 mt-3">{err}</div>}
      <div className="flex gap-2 mt-4">
        <button type="submit" className="fw-btn"><Check size={14} />Salvar aba</button>
        <button type="button" onClick={onCancel} className="fw-btn-ghost">Cancelar</button>
      </div>
    </form>
  );
}
function TabsManager({ products, tabs, catalogUrl, onAdd, onUpdate, onDelete, onMove, onPublish, publishState }) {
  const [editing, setEditing] = useState(null); // null | 'new' | id
  const [justSaved, setJustSaved] = useState(false);
  const [copied, setCopied] = useState(null);
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 30000); return () => clearInterval(t); }, []);
  const editTab = editing && editing !== 'new' ? tabs.find(t => t.id === editing) : null;
  const linkFor = (t) => catalogUrl + '#aba-' + tabSlug(t.name);
  const copy = async (t) => { try { await navigator.clipboard.writeText(linkFor(t)); setCopied(t.id); setTimeout(() => setCopied(null), 2000); } catch (e) { /* ignora */ } };
  return (
    <Section title="Abas do catálogo" action={editing ? null : <button onClick={() => { setEditing('new'); setJustSaved(false); }} className="fw-btn"><Plus size={14} />Nova aba</button>}>
      <div className="text-[12px] text-neutral-500 mb-3">Organize as peças em abas (ex.: Black Friday, Lançamentos). Abas promocionais só aparecem às clientes dentro do período, e o preço promocional vale enquanto ela estiver no ar.</div>
      {editing && (
        <TabForm key={editing} products={products} initial={editTab ? { ...emptyTabForm(), ...editTab } : null}
          onCancel={() => setEditing(null)}
          onSave={(t) => { if (editTab) onUpdate(editTab.id, t); else onAdd({ ...t, id: uid('tab') }); setEditing(null); setJustSaved(true); }} />
      )}
      {justSaved && !editing && (
        <div className="bg-neutral-900 border border-neutral-700 p-3 mb-3 flex flex-wrap items-center gap-3">
          <span className="text-[13px] text-neutral-200 flex-1 min-w-[200px]">Aba salva no sistema. Falta <b>publicar o catálogo</b> para ela aparecer às clientes.</span>
          <button className="fw-btn" onClick={onPublish} disabled={publishState === 'publishing'}><Check size={14} />{publishState === 'publishing' ? 'Publicando...' : 'Publicar agora'}</button>
        </div>
      )}
      {tabs.length === 0 && !editing && <div className="text-neutral-600 text-sm bg-neutral-950 border border-neutral-800 p-4 text-center">Nenhuma aba criada ainda.</div>}
      <div className="space-y-2">
        {tabs.map((t, i) => {
          const st = tabStatusLabel(t, now);
          const th = themeFor(t.bg);
          return (
            <div key={t.id} className="bg-neutral-950 border border-neutral-800 p-3">
              <div className="flex items-start gap-3">
                <span className="shrink-0 mt-0.5" style={{ width: 26, height: 26, background: t.bg, border: '1px solid #666', color: th.vars['--fg'], fontSize: 12, fontWeight: 700, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>Aa</span>
                <div className="flex-1 min-w-0">
                  <div className="text-sm text-neutral-100 font-medium truncate">{t.name} <span className="text-[10px] border border-neutral-600 text-neutral-400 px-1.5 py-0.5 rounded ml-1 align-middle">{t.kind === 'promo' ? 'promocional' : 'fixa'}</span></div>
                  <div className={`text-[12px] ${st.tone}`}>{st.text}</div>
                  <div className="text-[11px] text-neutral-500">{(t.productIds || []).length} produto(s){t.kind === 'promo' ? ' · ' + Object.keys(t.prices || {}).length + ' com preço promocional' : ''}{t.start ? ' · início ' + fmtTabDate(t.start) : ''}</div>
                </div>
              </div>
              <div className="flex flex-wrap gap-2 mt-3">
                <button className="fw-btn-ghost" onClick={() => { setEditing(t.id); setJustSaved(false); window.scrollTo(0, 0); }}><Pencil size={13} />Editar</button>
                <button className="fw-btn-ghost" onClick={() => { onUpdate(t.id, { active: t.active === false }); setJustSaved(true); }}>{t.active === false ? 'Ligar' : 'Desligar'}</button>
                <button className="fw-btn-ghost" onClick={() => copy(t)}>{copied === t.id ? 'Link copiado!' : 'Copiar link da aba'}</button>
                <button className="fw-btn-ghost" disabled={i === 0} onClick={() => { onMove(t.id, -1); setJustSaved(true); }} aria-label="Mover para a esquerda">←</button>
                <button className="fw-btn-ghost" disabled={i === tabs.length - 1} onClick={() => { onMove(t.id, 1); setJustSaved(true); }} aria-label="Mover para a direita">→</button>
                <button className="fw-btn-ghost" aria-label="Excluir aba" onClick={() => { if (window.confirm('Excluir a aba "' + t.name + '"? Os produtos não são apagados.')) { onDelete(t.id); setJustSaved(true); } }}><Trash2 size={13} /></button>
              </div>
            </div>
          );
        })}
      </div>
    </Section>
  );
}

function CatalogTab({ products, settings, tabs, onAddTab, onUpdateTab, onDeleteTab, onMoveTab, onSaveSettings, onPublish, publishState }) {
  const [waNumber, setWaNumber] = useState((settings && settings.whatsappNumber) || '');

  const catalogUrl = (() => {
    try {
      const url = new URL(window.location.href);
      const parts = url.pathname.split('/');
      parts[parts.length - 1] = '';
      url.pathname = parts.join('/');
      url.hash = ''; url.search = '';
      return url.toString();
    } catch (e) { return ''; }
  })();

  const save = () => onSaveSettings({ whatsappNumber: waNumber, storeName });

  const copyLink = async () => {
    try { await navigator.clipboard.writeText(catalogUrl); setCopied(true); setTimeout(() => setCopied(false), 2000); }
    catch (e) { /* ignore */ }
  };

  const withPhoto = products.filter(p => p.photos && p.photos.length > 0).length;

  return (
    <div>
      <Section title="Configurações do catálogo público">

          <Field label="Nome da loja (aparece no catálogo)"><input className="fw-input" value={storeName} onChange={e => setStoreName(e.target.value)} /></Field>
          <Field label="WhatsApp que recebe os pedidos (DDI+DDD+número, só dígitos)"><input className="fw-input" placeholder="5571999999999" value={waNumber} onChange={e => setWaNumber(e.target.value.replace(/[^0-9]/g, ''))} /></Field>
          <div className="md:col-span-2 flex justify-end"><button onClick={save} className="fw-btn"><Check size={14} />Salvar configurações</button></div>
        </div>
      </Section>

      <TabsManager products={products} tabs={tabs || []} catalogUrl={catalogUrl} onAdd={onAddTab} onUpdate={onUpdateTab} onDelete={onDeleteTab} onMove={onMoveTab} onPublish={onPublish} publishState={publishState} />

      <Section title="Publicar catálogo">
        <div className="bg-neutral-950 border border-neutral-800 p-4">
          <div className="text-[13px] text-neutral-300 mb-3">
            {products.length} produto(s) cadastrado(s), {withPhoto} com foto. Publicar atualiza a vitrine pública com fotos, descrição, cores/tamanhos disponíveis e preço de varejo de cada produto.
          </div>
          <button onClick={onPublish} disabled={!waNumber || publishState === 'publishing'} className="fw-btn mb-4">
            <Check size={14} />{publishState === 'publishing' ? 'Publicando...' : 'Publicar catálogo agora'}
          </button>
          {!waNumber && <div className="text-[12px] text-white bg-neutral-900 border border-white p-2 mb-4">Preencha e salve o número de WhatsApp antes de publicar.</div>}
          {publishState === 'published' && <div className="text-[12px] text-neutral-300 bg-neutral-900 border border-neutral-700 p-2 mb-4">Catálogo publicado com sucesso.</div>}
          {publishState === 'error' && <div className="text-[12px] text-white bg-neutral-900 border border-white p-2 mb-4">Erro ao publicar. Confira se rodou o catalog-setup.sql no Supabase.</div>}
          {publishState === 'no_tabs' && <div className="text-[12px] text-white bg-neutral-900 border border-white p-2 mb-4">Catálogo publicado, mas as <b>abas ainda não</b>: falta rodar o <b>supabase-abas.sql</b> no Supabase (uma vez só) e publicar de novo.</div>}

          {catalogUrl && (
            <div>
              <div className="text-[11px] text-neutral-500 mb-1">Link público do catálogo (envie esse link para os clientes):</div>
              <div className="flex items-center gap-2">
                <input readOnly className="fw-input flex-1" value={catalogUrl} onClick={e => e.target.select()} />
                <button onClick={copyLink} className="fw-btn-ghost">{copied ? 'Copiado!' : 'Copiar link'}</button>
              </div>
            </div>
          )}
        </div>
      </Section>
    </div>
  );
}

// ---------- Coupons ----------
const EMPTY_COUPON_FORM = { code: '', discount_type: 'percent', discount_value: '', valid_until: '', max_uses: '' };

function CouponsTab({ sb }) {
  const [coupons, setCoupons] = useState(null);
  const [form, setForm] = useState(EMPTY_COUPON_FORM);
  const [editingId, setEditingId] = useState(null);
  const [error, setError] = useState('');

  const load = async () => {
    try {
      const { data, error } = await sb.from('coupons').select('*').eq('user_id', SHARED_STORE_ID).order('created_at', { ascending: false });
      if (error) throw error;
      setCoupons(data || []);
    } catch (e) {
      console.error('Erro ao carregar cupons:', e);
      setCoupons([]);
    }
  };

  useEffect(() => { load(); }, []);

  const startEdit = (c) => {
    setEditingId(c.id);
    setForm({
      code: c.code, discount_type: c.discount_type, discount_value: c.discount_value,
      valid_until: c.valid_until || '', max_uses: c.max_uses ?? '',
    });
  };
  const cancelEdit = () => { setEditingId(null); setForm(EMPTY_COUPON_FORM); };

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    if (!form.code.trim() || form.discount_value === '') return;
    const payload = {
      code: form.code.trim().toUpperCase(),
      discount_type: form.discount_type,
      discount_value: Number(form.discount_value),
      valid_until: form.valid_until || null,
      max_uses: form.max_uses === '' ? null : Number(form.max_uses),
    };
    try {
      if (editingId) {
        const { error } = await sb.from('coupons').update(payload).eq('id', editingId);
        if (error) throw error;
      } else {
        const { error } = await sb.from('coupons').insert({ ...payload, user_id: SHARED_STORE_ID, active: true, current_uses: 0 });
        if (error) throw error;
      }
      cancelEdit();
      load();
    } catch (e) {
      setError('Erro ao salvar cupom: ' + (e.message || 'tente novamente'));
    }
  };

  const toggleActive = async (c) => {
    await sb.from('coupons').update({ active: !c.active }).eq('id', c.id);
    load();
  };

  const remove = async (id) => {
    await sb.from('coupons').delete().eq('id', id);
    load();
  };

  if (coupons === null) {
    return <div className="text-neutral-600 text-sm">Carregando cupons...</div>;
  }

  return (
    <div>
      <Section title={editingId ? 'Editando cupom' : 'Cadastro de cupons'}>
        <form onSubmit={submit} className="bg-neutral-950 border border-neutral-800 p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-4">

          <Field label="Tipo de desconto">
            <select className="fw-input" value={form.discount_type} onChange={e => setForm(f => ({ ...f, discount_type: e.target.value }))}>
              <option value="percent">Percentual (%)</option>
              <option value="fixed">Valor fixo (R$)</option>
            </select>
          </Field>
          <Field label={form.discount_type === 'percent' ? 'Percentual de desconto' : 'Valor de desconto (R$)'}>
            <input type="number" step="0.01" className="fw-input" value={form.discount_value} onChange={e => setForm(f => ({ ...f, discount_value: e.target.value }))} />
          </Field>
          <Field label="Validade (opcional)"><input type="date" className="fw-input" value={form.valid_until} onChange={e => setForm(f => ({ ...f, valid_until: e.target.value }))} /></Field>
          <Field label="Quantidade máxima de usos (opcional)"><input type="number" min="1" className="fw-input" value={form.max_uses} onChange={e => setForm(f => ({ ...f, max_uses: e.target.value }))} placeholder="Deixe em branco para ilimitado" /></Field>
          <div className="flex items-end gap-3">
            {editingId && <button type="button" onClick={cancelEdit} className="fw-btn-ghost">Cancelar</button>}
            <button className="fw-btn" type="submit">
              {editingId ? <Check size={14} /> : <Plus size={14} />}
              {editingId ? 'Salvar' : 'Adicionar cupom'}
            </button>
          </div>
          {error && <div className="sm:col-span-2 md:col-span-3 text-[12px] text-white bg-neutral-900 border border-white p-2">{error}</div>}
        </form>
      </Section>

      <div className="bg-neutral-950 border border-neutral-800 overflow-x-auto">
        <table className="w-full fw-table">
          <thead><tr><th>Cupom</th><th>Cadastro</th><th>Validade</th><th>Desconto</th><th>Usos</th><th>Status</th><th></th></tr></thead>
          <tbody>
            {coupons.length === 0 && <tr><td colSpan={7} className="text-neutral-600 text-center py-6">Nenhum cupom cadastrado.</td></tr>}
            {coupons.map(c => (
              <tr key={c.id}>
                <td className="font-medium text-neutral-100 fw-mono">{c.code}</td>
                <td>{(c.created_at || '').slice(0, 10)}</td>
                <td>{c.valid_until || 'sem validade'}</td>
                <td>{c.discount_type === 'percent' ? `${c.discount_value}%` : formatBRL(c.discount_value)}</td>
                <td>{c.current_uses}{c.max_uses != null ? ` / ${c.max_uses}` : ' / ∞'}</td>
                <td>
                  <button onClick={() => toggleActive(c)} className="fw-btn-ghost">

                  <button onClick={() => remove(c.id)} className="fw-btn-ghost"><Trash2 size={13} /></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ---------- Datas de nascimento recebidas pelo catálogo ----------
function BirthdayInbox({ clients, onAdd, onUpdate }) {
  const [rows, setRows] = useState([]);
  const norm = (t) => (t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

  const load = async () => {
    try {
      const { data, error } = await sb.from('catalog_orders').select('id,customer,birth_date,created_at')
        .not('birth_date', 'is', null).is('birth_imported_at', null).order('created_at', { ascending: false }).limit(100);
      if (!error && data) setRows(data);
    } catch (e) { /* tabela ainda não atualizada: não mostra nada */ }
  };
  useEffect(() => { load(); }, []);

  // uma linha por cliente (a data mais recente), guardando todos os ids para dar baixa juntos
  const groups = useMemo(() => {
    const map = new Map();
    rows.forEach(r => {
      const k = norm(r.customer);
      if (!k) return;
      if (!map.has(k)) map.set(k, { key: k, name: r.customer.trim(), birth: r.birth_date, at: r.created_at, ids: [] });
      map.get(k).ids.push(r.id);
    });
    return [...map.values()];
  }, [rows]);

  const done = async (ids) => {
    try { await sb.from('catalog_orders').update({ birth_imported_at: new Date().toISOString() }).in('id', ids); } catch (e) {}
    setRows(r => r.filter(x => !ids.includes(x.id)));
  };
  const save = (g, match) => {
    if (match) onUpdate(match.id, { birthDate: g.birth });
    else onAdd({ id: uid('client'), name: g.name, phone: '', type: 'varejo', birthDate: g.birth, createdAt: todayISO() });
    done(g.ids);
  };

  if (groups.length === 0) return null;
  return (
    <Section title="🎂 Datas recebidas pelo catálogo">
      <div className="bg-neutral-950 border border-neutral-800 mb-4">
        <div className="px-4 py-2 text-[11px] text-neutral-500 border-b border-neutral-900">Clientes que marcaram o aceite de uso da data apenas para lembretes de aniversário.</div>
        {groups.map(g => {
          const match = clients.find(c => norm(c.name) === g.key);
          return (
            <div key={g.key} className="flex flex-wrap items-center gap-3 px-4 py-3 border-b border-neutral-900 last:border-b-0">
              <div className="flex-1 min-w-[180px]">
                <div className="text-sm text-neutral-100 font-medium">{g.name}</div>
                <div className="text-[11px] text-neutral-500">
                  {formatBirth(g.birth)}
                  {match ? (match.birthDate && match.birthDate !== g.birth ? ' · cadastro tem ' + formatBirth(match.birthDate) : match.birthDate ? ' · já consta no cadastro' : ' · cliente já cadastrada') : ' · ainda não cadastrada'}
                </div>
              </div>
              <div className="flex gap-2">
                <button onClick={() => save(g, match)} className="fw-btn">{match ? (match.birthDate ? 'Atualizar data' : 'Salvar data') : 'Cadastrar cliente'}</button>
                <button onClick={() => done(g.ids)} className="fw-btn-ghost" aria-label="Descartar"><X size={13} /></button>
              </div>
            </div>
          );
        })}
      </div>
    </Section>
  );
}

function ClientsTab({ clients, onAdd, onUpdate, onDelete, storeName }) {
  const blank = { name: '', phone: '', type: 'varejo', birthDate: '' };

  const [editId, setEditId] = useState(null);
  const [draft, setDraft] = useState(blank);
  const [filter, setFilter] = useState('todas');

  const submit = (e) => {
    e.preventDefault();
    if (!form.name.trim()) return;
    onAdd({ id: uid('client'), ...form, name: form.name.trim(), createdAt: todayISO() });
    setForm(blank);
  };
  const startEdit = (c) => { setEditId(c.id); setDraft({ name: c.name || '', phone: c.phone || '', type: c.type || 'varejo', birthDate: c.birthDate || '' }); };
  const saveEdit = () => {
    if (!draft.name.trim()) return;
    onUpdate(editId, { ...draft, name: draft.name.trim() });
    setEditId(null);
  };
  const nowM = new Date().getMonth() + 1;
  const visible = clients.filter(c => {
    if (filter === 'todas') return true;
    if (filter === 'semdata') return !parseBirth(c.birthDate);
    const info = birthdayInfo(c.birthDate);
    if (!info) return false;
    if (filter === 'mes') return info.month === nowM;
    return true;
  });

  return (
    <div>
      <BirthdayInbox clients={clients} onAdd={onAdd} onUpdate={onUpdate} />
      <Section title="Cadastro de clientes">

          <Field label="Telefone (com DDD)"><input className="fw-input" inputMode="tel" value={form.phone} onChange={e => setForm(f => ({ ...f, phone: e.target.value }))} /></Field>
          <Field label="Data de nascimento"><input type="date" className="fw-input" max={localISO()} value={form.birthDate} onChange={e => setForm(f => ({ ...f, birthDate: e.target.value }))} /></Field>
          <Field label="Tipo">
            <select className="fw-input" value={form.type} onChange={e => setForm(f => ({ ...f, type: e.target.value }))}>
              <option value="varejo">Varejo</option><option value="atacado">Atacado</option>
            </select>
          </Field>
          <div className="flex items-end sm:col-span-2 md:col-span-2"><button className="fw-btn w-full md:w-auto" type="submit"><Plus size={14} />Adicionar cliente</button></div>
        </form>
      </Section>

      <div className="flex flex-wrap gap-2 mb-3">
        {[['todas', 'Todas'], ['mes', 'Aniversariantes do mês'], ['semdata', 'Sem data de nascimento']].map(([k, l]) => (

      <div className="bg-neutral-950 border border-neutral-800 overflow-x-auto">
        <table className="w-full fw-table">
          <thead><tr><th>Nome</th><th className="hidden md:table-cell">Telefone</th><th>Nascimento</th><th className="hidden md:table-cell">Tipo</th><th className="hidden md:table-cell">Desde</th><th></th></tr></thead>
          <tbody>
            {visible.length === 0 && <tr><td colSpan={6} className="text-neutral-600 text-center py-6">{clients.length === 0 ? 'Nenhum cliente cadastrado.' : 'Nenhuma cliente neste filtro.'}</td></tr>}
            {visible.map(c => {
              if (editId === c.id) {
                return (
                  <tr key={c.id}>

// ---------- Stock ----------
function StockTab({ products, onSetStock, onUpdateProduct }) {
  const restock = products
    .map(p => {
      const min = p.minStock ?? 3;
      return { product: p, min, items: (p.variants || []).filter(v => v.stock <= min) };
    })
    .filter(x => x.items.length > 0);
  const totalItems = restock.reduce((s, x) => s + x.items.length, 0);

  return (
    <div>
      <Section title="Reposição necessária">
        {restock.length === 0 ? (
          <div className="bg-neutral-950 border border-neutral-800 p-4 text-sm text-neutral-500">Nenhum item abaixo do estoque mínimo. Tudo em dia.</div>
        ) : (
          <div className="bg-neutral-950 border border-white p-4">
            <div className="text-[12px] font-semibold text-white mb-3 flex items-center gap-1.5">
              <AlertTriangle size={13} />
              {totalItems} {totalItems === 1 ? 'item precisa' : 'itens precisam'} de reposição em {restock.length} {restock.length === 1 ? 'produto' : 'produtos'}
            </div>
            <div className="flex flex-col gap-3">
              {restock.map(({ product, min, items }) => (
                <div key={product.id}>
                  <div className="text-[13px] font-semibold text-neutral-100 mb-1">{product.name}</div>
                  <div className="flex flex-wrap gap-1.5">
                    {items.map(v => (
                      <span key={v.color + '|' + v.size} className="text-[11px] px-2 py-0.5 rounded-full bg-white text-black font-semibold">
                        {v.color} / {v.size}: {v.stock} (mín. {min})
                      </span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </Section>

      <Section title="Controle de estoque por cor e tamanho">
        {products.length === 0 && <div className="text-neutral-600 text-sm">Cadastre produtos primeiro na aba Produtos.</div>}
        {products.map(p => {
          const colors = [...new Set(p.variants.map(v => v.color))];
          const sizes = ALL_SIZES.filter(s => p.variants.some(v => v.size === s));
          const lowCount = p.variants.filter(v => v.stock <= (p.minStock ?? 3)).length;
          return (
            <div key={p.id} className="bg-neutral-950 border border-neutral-800 p-4 mb-4">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <div className="font-semibold text-neutral-100">{p.name}</div>
                  {lowCount > 0 && (
                    <span className="text-[10.5px] px-2 py-0.5 rounded-full bg-white text-black font-bold">
                      repor {lowCount} {lowCount === 1 ? 'item' : 'itens'}
                    </span>
                  )}
                </div>
                <label className="flex items-center gap-2 text-xs text-neutral-500">
                  Estoque mínimo:
                  <input type="number" className="fw-input w-16" value={p.minStock ?? 3} onChange={e => onUpdateProduct(p.id, { minStock: Number(e.target.value) })} />
                </label>
              </div>
              <table className="w-full fw-table">
                <thead><tr><th>Cor</th>{sizes.map(s => <th key={s} className="text-center">{s}</th>)}</tr></thead>
                <tbody>
                  {colors.map(color => (
                    <tr key={color}>
                      <td className="font-medium">{color}</td>
                      {sizes.map(size => {
                        const v = p.variants.find(v => v.color === color && v.size === size);
                        const low = v && v.stock <= (p.minStock ?? 3);
                        return (
                          <td key={size} className="text-center">
                            <input
                              type="number" min="0"
                              className="fw-input w-16 text-center"
                              style={low ? { borderColor: '#ffffff', color: '#ffffff', fontWeight: 700, boxShadow: '0 0 0 1px #ffffff' } : {}}
                              value={v ? v.stock : 0}
                              onChange={e => onSetStock(p.id, color, size, e.target.value)}
                            />
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          );
        })}
      </Section>
    </div>
  );
}

function SalesTab({ products, clients, sales, onRegister, onDelete, onConvert, onOpenAgenda }) {
  const [convId, setConvId] = useState(null);
  const [convN, setConvN] = useState(1);
  const [convDue, setConvDue] = useState(localISO());
  const [clientId, setClientId] = useState('');
  const [recvMode, setRecvMode] = useState('agora');
  const [installments, setInstallments] = useState(1);
  const [firstDue, setFirstDue] = useState(addDaysISO(localISO(), 30));
  const [saleErr, setSaleErr] = useState('');
  const [type, setType] = useState('varejo');
  const [date, setDate] = useState(todayISO());
  const [cart, setCart] = useState([]);
  const [pick, setPick] = useState({ productId: '', color: '', size: '', qty: 1 });

  const selectedProduct = products.find(p => p.id === pick.productId);
  const colorsAvail = selectedProduct ? [...new Set(selectedProduct.variants.map(v => v.color))] : [];
  const sizesAvail = selectedProduct && pick.color ? [...new Set(selectedProduct.variants.filter(v => v.color === pick.color).map(v => v.size))] : [];
  const variantAvail = selectedProduct && pick.color ? selectedProduct.variants.find(v => v.color === pick.color && v.size === pick.size) : null;

  const addToCart = () => {
    if (!selectedProduct || !pick.color || !pick.size || !pick.qty) return;
    const price = type === 'atacado' ? selectedProduct.wholesale : selectedProduct.retail;
    setCart(c => [...c, { productId: pick.productId, productName: selectedProduct.name, color: pick.color, size: pick.size, qty: Number(pick.qty), price }]);
    setPick({ productId: '', color: '', size: '', qty: 1 });
  };
  const removeFromCart = (i) => setCart(c => c.filter((_, idx) => idx !== i));
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);

  const submitSale = () => {
    if (cart.length === 0) return;
    const client = clients.find(c => c.id === clientId);
    if (recvMode === 'receber' && !client) { setSaleErr('Para vender a receber, escolha a cliente (não vale "Consumidor final").'); return; }
    if (recvMode === 'receber' && !firstDue) { setSaleErr('Informe o vencimento da primeira parcela.'); return; }
    setSaleErr('');
    onRegister({ date, clientId: clientId || null, clientName: client ? client.name : 'Consumidor final', type, items: cart, receive: recvMode === 'receber' ? { n: installments, firstDue } : null });
    setCart([]); setRecvMode('agora'); setInstallments(1);
  };

  return (
    <div>
      <Section title="Registrar venda">
        <div className="bg-neutral-950 border border-neutral-800 p-4 mb-4">
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mb-4">

              </select>

            <Field label="Tipo de venda">
              <select className="fw-input" value={type} onChange={e => setType(e.target.value)}>
                <option value="varejo">Varejo</option><option value="atacado">Atacado</option>
              </select>
            </Field>
            <Field label="Recebimento">
              <select className="fw-input" value={recvMode} onChange={e => { setRecvMode(e.target.value); setSaleErr(''); }}>
                <option value="agora">Recebido agora</option><option value="receber">A receber (fiado / parcelado)</option>
              </select>
            </Field>
          </div>
          {recvMode === 'receber' && (
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mb-4">

                <select className="fw-input" value={installments} onChange={e => setInstallments(Number(e.target.value))}>

              <select className="fw-input" value={pick.productId} onChange={e => setPick({ productId: e.target.value, color: '', size: '', qty: 1 })}>
                <option value="">Selecione</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </Field>
            <Field label="Cor">
              <select className="fw-input" value={pick.color} onChange={e => setPick(p => ({ ...p, color: e.target.value }))} disabled={!selectedProduct}>
                <option value="">Selecione</option>

                <option value="">Selecione</option>

              <table className="w-full fw-table">
                <thead><tr><th>Produto</th><th>Cor</th><th>Tam.</th><th>Qtd</th><th>Preço unit.</th><th>Subtotal</th><th></th></tr></thead>

              </div>
            </div>
          )}

        {convId && (() => {

          return (
            <div className="bg-neutral-950 border border-neutral-700 p-4 mb-3">
              <div className="text-sm text-neutral-100 font-medium mb-1">Marcar como a receber — {cs.clientName || 'Cliente'} · {formatBRL(cs.total)} ({formatDMY(cs.date)})</div>
              <div className="text-[12px] text-neutral-500 mb-3">Esta venda estava lançada como recebida. Ao confirmar, o valor sai do caixa e vira cobrança na Agenda; só volta ao caixa quando você marcar como recebido. Se o vencimento já passou, a cliente aparece como inadimplente.</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-md">
                <Field label="Vencimento (1ª parcela)"><input type="date" className="fw-input" value={convDue} onChange={e => setConvDue(e.target.value)} /></Field>
                <Field label="Parcelas (mensais)">
                  <select className="fw-input" value={convN} onChange={e => setConvN(Number(e.target.value))}>
                    {Array.from({ length: 12 }, (_, i) => i + 1).map(n => <option key={n} value={n}>{n === 1 ? '1x (uma cobrança)' : n + 'x'}</option>)}
                  </select>
                </Field>
              </div>
              <div className="flex gap-2 mt-3">
                <button className="fw-btn" onClick={() => { if (!convDue) return; onConvert(convId, { n: convN, firstDue: convDue }); setConvId(null); setConvN(1); if (onOpenAgenda) onOpenAgenda(); }}><Check size={14} />Confirmar</button>
                <button className="fw-btn-ghost" onClick={() => setConvId(null)}>Cancelar</button>
              </div>
            </div>
          );
        })()}
        <div className="bg-neutral-950 border border-neutral-800 overflow-x-auto">
          <table className="w-full fw-table">
            <thead><tr><th>Data</th><th>Cliente</th><th>Tipo</th><th>Total</th><th>Lucro</th><th></th></tr></thead>
            <tbody>
              {sales.length === 0 && <tr><td colSpan={6} className="text-neutral-600 text-center py-6">Nenhuma venda registrada.</td></tr>}
              {[...sales].reverse().map(s => (
                <tr key={s.id}>
                  <td>{s.date}</td><td>{s.clientName}{s.onCredit && <span className="ml-2 text-[10px] border border-neutral-600 text-neutral-400 px-1.5 py-0.5 rounded">a receber</span>}</td><td className="capitalize">{s.type}</td>
                  <td>{formatBRL(s.total)}</td>
                  <td className={s.profit >= 0 ? 'text-white' : 'text-white'}>{formatBRL(s.profit)}</td>
                  <td className="whitespace-nowrap">
                    {!s.onCredit && <button onClick={() => { setConvId(s.id); setConvDue(localISO()); window.scrollTo(0, document.body.scrollHeight); }} className="fw-btn-ghost mr-1" title="Esta venda ainda não foi paga">Em aberto?</button>}
                    <button onClick={() => onDelete(s.id)} className="fw-btn-ghost" aria-label="Excluir venda"><Trash2 size={13} /></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>
    </div>
  );
}

// ---------- Purchases ----------
function PurchasesTab({ products, purchases, onRegister, onDelete }) {
  const [supplier, setSupplier] = useState('');
  const [date, setDate] = useState(todayISO());
  const [cart, setCart] = useState([]);
  const [pick, setPick] = useState({ productId: '', color: '', size: '', qty: 1, cost: '' });

  const selectedProduct = products.find(p => p.id === pick.productId);
  const colorsAvail = selectedProduct ? [...new Set(selectedProduct.variants.map(v => v.color))] : [];
  const sizesAvail = selectedProduct && pick.color ? [...new Set(selectedProduct.variants.filter(v => v.color === pick.color).map(v => v.size))] : [];

  const addToCart = () => {
    if (!selectedProduct || !pick.color || !pick.size || !pick.qty) return;
    const cost = pick.cost !== '' ? Number(pick.cost) : selectedProduct.cost;
    setCart(c => [...c, { productId: pick.productId, productName: selectedProduct.name, color: pick.color, size: pick.size, qty: Number(pick.qty), cost }]);
    setPick({ productId: '', color: '', size: '', qty: 1, cost: '' });
  };
  const removeFromCart = (i) => setCart(c => c.filter((_, idx) => idx !== i));
  const total = cart.reduce((s, i) => s + i.cost * i.qty, 0);

  const submit = () => {
    if (cart.length === 0 || !supplier.trim()) return;
    onRegister({ date, supplier, items: cart });
    setCart([]); setSupplier('');
  };

  return (
    <div>
      <Section title="Registrar compra de fornecedor">
        <div className="bg-neutral-950 border border-neutral-800 p-4 mb-4">
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-4">
            <Field label="Data"><input type="date" className="fw-input" value={date} onChange={e => setDate(e.target.value)} /></Field>
            <Field label="Fornecedor"><input className="fw-input" value={supplier} onChange={e => setSupplier(e.target.value)} placeholder="Nome do fornecedor" /></Field>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3 items-end mb-3 border-t border-neutral-800 pt-3">
            <Field label="Produto">
              <select className="fw-input" value={pick.productId} onChange={e => setPick({ productId: e.target.value, color: '', size: '', qty: 1, cost: '' })}>
                <option value="">Selecione</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </Field>
            <Field label="Cor">
              <select className="fw-input" value={pick.color} onChange={e => setPick(p => ({ ...p, color: e.target.value }))} disabled={!selectedProduct}>
                <option value="">Selecione</option>
                {colorsAvail.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Tamanho">
              <select className="fw-input" value={pick.size} onChange={e => setPick(p => ({ ...p, size: e.target.value }))} disabled={!pick.color}>
                <option value="">Selecione</option>
                {sizesAvail.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </Field>
            <Field label="Qtd"><input type="number" min="1" className="fw-input" value={pick.qty} onChange={e => setPick(p => ({ ...p, qty: e.target.value }))} /></Field>
            <button onClick={addToCart} className="fw-btn justify-center"><Plus size={14} />Adicionar item</button>
          </div>
          {cart.length > 0 && (
            <div className="border-t border-neutral-800 pt-3">
              <table className="w-full fw-table">
                <thead><tr><th>Produto</th><th>Cor</th><th>Tam.</th><th>Qtd</th><th>Custo unit.</th><th>Subtotal</th><th></th></tr></thead>
                <tbody>
                  {cart.map((i, idx) => (
                    <tr key={idx}>
                      <td>{i.productName}</td><td>{i.color}</td><td>{i.size}</td><td>{i.qty}</td>
                      <td>{formatBRL(i.cost)}</td><td>{formatBRL(i.cost * i.qty)}</td>
                      <td><button onClick={() => removeFromCart(idx)} className="fw-btn-ghost"><X size={12} /></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="flex items-center justify-between mt-3">
                <div className="fw-mono text-neutral-100 font-bold text-lg">Total: {formatBRL(total)}</div>
                <button onClick={submit} className="fw-btn"><Check size={14} />Registrar compra</button>
              </div>
            </div>
          )}
        </div>
      </Section>

      <Section title="Histórico de compras">
        <div className="bg-neutral-950 border border-neutral-800 overflow-x-auto">
          <table className="w-full fw-table">
            <thead><tr><th>Data</th><th>Fornecedor</th><th>Itens</th><th>Total</th><th></th></tr></thead>
            <tbody>
              {purchases.length === 0 && <tr><td colSpan={5} className="text-neutral-600 text-center py-6">Nenhuma compra registrada.</td></tr>}
              {[...purchases].reverse().map(p => (
                <tr key={p.id}>
                  <td>{p.date}</td><td>{p.supplier}</td><td>{p.items.length}</td><td>{formatBRL(p.total)}</td>
                  <td><button onClick={() => onDelete(p.id)} className="fw-btn-ghost"><Trash2 size={13} /></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>
    </div>
  );
}

// ---------- Pricing calculator ----------
function PricingTab({ products, costs, margin, onAddCost, onDeleteCost, onSetMargin, onApplyPrice }) {
  const [productId, setProductId] = useState('');
  const [manualCost, setManualCost] = useState('');
  const [form, setForm] = useState({ name: '', type: 'fixo', value: '' });

  const product = products.find(p => p.id === productId);
  const baseCost = productId ? (manualCost !== '' ? Number(manualCost) : (product ? product.cost : 0)) : Number(manualCost) || 0;

  const fixedItems = costs.filter(c => c.type === 'fixo');
  const percentItems = costs.filter(c => c.type === 'percentual');
  const marginNum = Number(margin) || 0;

  const totalFixed = baseCost + fixedItems.reduce((s, c) => s + Number(c.value), 0);
  const totalPercent = percentItems.reduce((s, c) => s + Number(c.value), 0) + marginNum;
  const invalid = totalPercent >= 100;
  const suggestedPrice = invalid ? null : totalFixed / (1 - totalPercent / 100);

  const submitCost = (e) => {
    e.preventDefault();
    if (!form.name.trim() || form.value === '') return;
    onAddCost({ name: form.name, type: form.type, value: Number(form.value) });
    setForm({ name: '', type: 'fixo', value: '' });
  };

  return (
    <div>
      <Section title="Custos cadastrados">
        <form onSubmit={submitCost} className="bg-neutral-950 border border-neutral-800 p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mb-4">
          <Field label="Nome do custo"><input className="fw-input" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="Frete, embalagem, taxa cartão..." /></Field>
          <Field label="Tipo">
            <select className="fw-input" value={form.type} onChange={e => setForm(f => ({ ...f, type: e.target.value }))}>
              <option value="fixo">Valor fixo (R$)</option>
              <option value="percentual">Percentual (%) do preço</option>
            </select>
          </Field>
          <Field label={form.type === 'fixo' ? 'Valor (R$)' : 'Percentual (%)'}>
            <input type="number" step="0.01" className="fw-input" value={form.value} onChange={e => setForm(f => ({ ...f, value: e.target.value }))} />
          </Field>
          <div className="flex items-end"><button className="fw-btn" type="submit"><Plus size={14} />Adicionar custo</button></div>
        </form>
        <div className="bg-neutral-950 border border-neutral-800 overflow-x-auto">
          <table className="w-full fw-table">
            <thead><tr><th>Custo</th><th>Tipo</th><th>Valor</th><th></th></tr></thead>
            <tbody>
              {costs.length === 0 && <tr><td colSpan={4} className="text-neutral-600 text-center py-6">Nenhum custo cadastrado ainda.</td></tr>}
              {costs.map(c => (
                <tr key={c.id}>
                  <td className="text-neutral-100">{c.name}</td>
                  <td>{c.type === 'fixo' ? 'Valor fixo' : 'Percentual do preço'}</td>
                  <td>{c.type === 'fixo' ? formatBRL(c.value) : `${c.value}%`}</td>
                  <td><button onClick={() => onDeleteCost(c.id)} className="fw-btn-ghost"><Trash2 size={13} /></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>

      <Section title="Calcular preço de venda">
        <div className="bg-neutral-950 border border-neutral-800 p-4 mb-4">
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-4">
            <Field label="Produto (opcional — preenche o custo automaticamente)">
              <select className="fw-input" value={productId} onChange={e => { setProductId(e.target.value); setManualCost(''); }}>
                <option value="">Nenhum — inserir custo manualmente</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </Field>
            <Field label="Custo do produto (R$)">
              <input type="number" step="0.01" className="fw-input"
                value={manualCost !== '' ? manualCost : (product ? product.cost : '')}
                onChange={e => setManualCost(e.target.value)} />
            </Field>
            <Field label="Margem de lucro desejada (%)">
              <input type="number" step="0.01" className="fw-input" value={margin} onChange={e => onSetMargin(e.target.value === '' ? '' : Number(e.target.value))} />
            </Field>
          </div>

          {invalid ? (
            <div className="text-[13px] text-white bg-neutral-900 border border-white p-3">
              ⚠ Os percentuais cadastrados (custos + margem) somam {totalPercent.toFixed(1)}%, que é igual ou maior que 100%.
              Não existe preço possível nessas condições — reduza a margem ou os custos percentuais.
            </div>
          ) : (
            <div>
              <div className="flex flex-wrap gap-4 mb-4">
                <StatCard label="Preço de venda sugerido" value={formatBRL(suggestedPrice)} />
                <StatCard label="Custos totais (R$)" value={formatBRL(totalFixed + percentItems.reduce((s, c) => s + suggestedPrice * (Number(c.value) / 100), 0))} />
                <StatCard label="Lucro líquido estimado" value={formatBRL(suggestedPrice * (marginNum / 100))} sub={`${marginNum}% do preço`} />
              </div>

              <div className="bg-neutral-900 border border-neutral-800 p-4 mb-4">
                <div className="text-sm font-semibold text-neutral-200 mb-3">Como esse preço se decompõe</div>
                <table className="w-full fw-table">
                  <thead><tr><th>Item</th><th>Tipo</th><th>Valor em R$ no preço final</th></tr></thead>
                  <tbody>
                    <tr><td>Custo do produto + custos fixos</td><td>Fixo</td><td>{formatBRL(totalFixed)}</td></tr>
                    {percentItems.map(c => (
                      <tr key={c.id}><td>{c.name}</td><td>{c.value}%</td><td>{formatBRL(suggestedPrice * (Number(c.value) / 100))}</td></tr>
                    ))}
                    <tr><td className="font-semibold text-white">Margem de lucro</td><td>{marginNum}%</td><td className="font-semibold text-white">{formatBRL(suggestedPrice * (marginNum / 100))}</td></tr>
                  </tbody>
                </table>
              </div>

              {product && (
                <div className="flex gap-3">
                  <button onClick={() => onApplyPrice(product.id, 'retail', suggestedPrice)} className="fw-btn"><Check size={14} />Aplicar como preço de varejo</button>
                  <button onClick={() => onApplyPrice(product.id, 'wholesale', suggestedPrice)} className="fw-btn-ghost"><Check size={14} />Aplicar como preço de atacado</button>
                </div>
              )}
            </div>
          )}
        </div>
      </Section>
    </div>
  );
}

// ---------- Finance ----------
function FinanceTab({ finance, onAdd, onDelete, cashFlow }) {
  const [form, setForm] = useState({ date: todayISO(), type: 'entrada', category: '', desc: '', value: '' });
  const submit = (e) => {
    e.preventDefault();
    if (!form.value || !form.desc.trim()) return;
    onAdd({ ...form, value: Number(form.value) });
    setForm({ date: todayISO(), type: 'entrada', category: '', desc: '', value: '' });
  };
  const balance = finance.reduce((s, f) => s + (f.type === 'entrada' ? f.value : -f.value), 0);
  const totalIn = finance.filter(f => f.type === 'entrada').reduce((s, f) => s + f.value, 0);
  const totalOut = finance.filter(f => f.type === 'saida').reduce((s, f) => s + f.value, 0);

  return (
    <div>
      <Section title="Entradas e saídas financeiras">
        <div className="flex gap-4 mb-4">
          <StatCard label="Total de entradas" value={formatBRL(totalIn)} />
          <StatCard label="Total de saídas" value={formatBRL(totalOut)} />

          <Field label="Data"><input type="date" className="fw-input" value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} /></Field>
          <Field label="Tipo">
            <select className="fw-input" value={form.type} onChange={e => setForm(f => ({ ...f, type: e.target.value }))}>

            </select>
          </Field>
          <Field label="Categoria"><input className="fw-input" value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))} placeholder="Aluguel, marketing..." /></Field>
          <Field label="Descrição"><input className="fw-input" value={form.desc} onChange={e => setForm(f => ({ ...f, desc: e.target.value }))} /></Field>
          <Field label="Valor"><input type="number" step="0.01" className="fw-input" value={form.value} onChange={e => setForm(f => ({ ...f, value: e.target.value }))} /></Field>

            <ResponsiveContainer width="100%" height="100%">

                <XAxis dataKey="date" stroke="#737373" fontSize={11} />
                <YAxis stroke="#737373" fontSize={11} />

              </LineChart>

          )}

      </Section>

      <Section title="Lançamentos">
        <div className="bg-neutral-950 border border-neutral-800 overflow-x-auto">
          <table className="w-full fw-table">
            <thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th></th></tr></thead>
            <tbody>
              {finance.length === 0 && <tr><td colSpan={6} className="text-neutral-600 text-center py-6">Nenhum lançamento.</td></tr>}
              {[...finance].reverse().map(f => (
                <tr key={f.id}>
                  <td>{f.date}</td>
                  <td className="flex items-center gap-1">{f.type === 'entrada' ? <TrendingUp size={13} className="text-white" /> : <TrendingDown size={13} className="text-white" />} {f.type}</td>
                  <td>{f.category || '-'}</td>
                  <td>{f.desc}{f.auto && <span className="text-neutral-600 text-[10px] ml-1">(auto)</span>}</td>
                  <td className={f.type === 'entrada' ? 'text-white' : 'text-white'}>{formatBRL(f.value)}</td>
                  <td>{!f.auto && <button onClick={() => onDelete(f.id)} className="fw-btn-ghost"><Trash2 size={13} /></button>}</td>

          </table>
        </div>
      </Section>
    </div>
  );
